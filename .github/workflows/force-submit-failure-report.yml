name: Force submit failure report

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to report
        required: true
        type: choice
        default: qastg
        options:
          - dev
          - qastg
          - qalv
          - prod
  schedule:
    - cron: "25 16 * * *"

permissions: {}

jobs:
  report:
    name: Report force submit count mismatches # side bar title
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'prod' }}
    env:
      DB_PORT: ${{ vars.DATABASE_PORT }}
      DB_NAME: ${{ secrets.DATABASE_NAME }}
      DB_URL: ${{ vars.DATABASE_URL }}
    steps:
      - name: Show environment
        run: |
          echo "Hello world, env ${{ inputs.environment }}"
          echo "Port, $DB_PORT"
          echo "Name, $DB_NAME, depends context"
          echo "database url, $DB_URL, depends context"
