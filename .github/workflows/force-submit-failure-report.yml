name: Force submit failure report

on:
  workflow_dispatch:
    inputs:
      environment:
        description: environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qastg
          - prod

jobs:
  deploy:
    name: Desploy to production # side bar title
    runs-on: ubuntu-latest
    steps:
      - name: Show environment
        env:
          SELECTED_ENV: ${{ inputs.environment }}
        run: echo "Hello world, env $SELECTED_ENV"
